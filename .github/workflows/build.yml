name: Build Telegram 13.0 for iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          ref: f1dd7a2dbd02cbbf513e75d5695d8d36d1cf5838
          submodules: recursive
          persist-credentials: false
      - name: Select release toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          df -h .
      - name: Build ARM64 IPA from Telegram's public release configuration
        id: compile
        run: |
          printf '\nbuild --//Telegram:disableProvisioningProfiles\nbuild --features=disable_legacy_signing\n' >> .bazelrc
          # The device rules append a profile packaging step even for unsigned bundles.
          python3 - <<'PY'
          from pathlib import Path
          rules = Path("build-system/bazel-rules/rules_apple/apple/internal")
          p = rules / "ios_rules.bzl"
          text = p.read_text()
          old = "if platform_prerequisites.platform.is_device:\n        processor_partials.append(\n            partials.provisioning_profile_partial("
          assert old in text
          p.write_text(text.replace(old, old.replace("platform.is_device:", "platform.is_device and ctx.file.provisioning_profile:")))
          p = rules / "codesigning_support.bzl"
          text = p.read_text()
          old = "if (platform_prerequisites.platform.is_device and\n        rule_descriptor.requires_signing_for_device and"
          assert old in text
          p.write_text(text.replace(old, old.replace("platform.is_device and", 'platform.is_device and\n        "disable_legacy_signing" not in platform_prerequisites.features and')))
          PY
          python3 -u build-system/Make/Make.py build \
            --configurationPath=build-system/appstore-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=35303
      - name: Verify device binary and archive
        run: |
          mkdir -p "$RUNNER_TEMP/telegram-verify"
          cp -L bazel-bin/Telegram/Telegram.ipa "$RUNNER_TEMP/Telegram-13.0-arm64.ipa"
          cd "$RUNNER_TEMP/telegram-verify"
          unzip -q "$RUNNER_TEMP/Telegram-13.0-arm64.ipa"
          app=(Payload/*.app)
          plist="${app[0]}/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = 13.0
          test "$(plutil -extract CFBundleSupportedPlatforms.0 raw "$plist")" = iPhoneOS
          exe="${app[0]}/$(plutil -extract CFBundleExecutable raw "$plist")"
          lipo "$exe" -verify_arch arm64
          otool -l "$exe" | awk '$1=="cryptid" && $2!=0 {exit 1}'
          shasum -a 256 "$RUNNER_TEMP/Telegram-13.0-arm64.ipa"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          name: Telegram-13.0-arm64
          path: ${{ runner.temp }}/Telegram-13.0-arm64.ipa
          if-no-files-found: error
          retention-days: 7
